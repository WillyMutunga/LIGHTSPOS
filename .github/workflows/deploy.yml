name: Deploy to cPanel FTP

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies & Build Frontend
      working-directory: ./frontend
      run: |
        npm install
        npm run build

    - name: Sync Frontend Files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./frontend/dist/
        server-dir: ./lightspos.skysoftsystems.co.ke/
        state-name: .ftp-deploy-sync-state-frontend.json

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Sync Backend Files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./backend/
        server-dir: ./lightspos.skysoftsystems.co.ke/lightspos_backend/
        state-name: .ftp-deploy-sync-state-backend.json
        exclude: |
          **/.env
          **/db.sqlite3
          **/venv/**
          **/.git/**
          **/__pycache__/**
